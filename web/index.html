<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Chicken</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
</script>
</head>
<body>
<main>
  <canvas id="stage" aria-label="Animated chicken that copies your arm movements"></canvas>
  <div id="bawk" hidden>BAWK!</div>
  <div id="preview">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <p id="status" role="status">Allow the camera and flap your arms.</p>
</main>
<aside>
  <h1>Mirror Chicken</h1>
  <div class="row">
    <button id="start" type="button">Start camera</button>
    <button id="demo" type="button" class="ghost">Demo</button>
  </div>
  <fieldset>
    <legend>Robot arm (optional)</legend>
    <div class="row">
      <button id="connect" type="button" class="ghost">Connect Arduino</button>
      <select id="side" aria-label="Which of your arms drives the robot">
        <option value="right">my right arm</option>
        <option value="left">my left arm</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="claw"> claw open</label>
  </fieldset>
  <dl>
    <dt>Shoulder</dt><dd id="v-elev">–</dd>
    <dt>Elbow bend</dt><dd id="v-flex">–</dd>
    <dt>Servos</dt><dd id="v-servo">–</dd>
    <dt>Pose latency</dt><dd id="v-lat">–</dd>
    <dt>Last packet</dt><dd id="v-wire">–</dd>
  </dl>
</aside>
<script type="module" src="js/main.js"></script>
</body>
</html>
